on:
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- 1. PYTHON (com cache do pip) ---
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Jupyter and Automation Tools
        run: pip install -r requirements.txt

      # --- 2. QUARTO ---
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --- 3. R (binários prontos) ---
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'      # se der erro de versão, troque por 'release'
          use-public-rspm: true

      # --- 4. PACOTES DO R (cache automático) ---
      - name: Install R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1        # suba para 2, 3... para forçar reinstalação
          packages: |
            any::knitr
            any::rmarkdown
            any::gsheet
            any::corrplot
            any::tidyverse
            any::nlme
            any::lme4
            any::car
            any::reactable
            any::DT
            any::htmltools
            any::geomtextpath
            any::viridis
            any::ggrepel
            any::reticulate
            any::rstatix
            any::magrittr
            any::dplyr
            any::reshape2
            any::stringr
            any::stringi
            any::readr
            any::readxl
            any::skimr
            any::psych
            any::Hmisc
            any::ggplot2
            any::showtext
            any::flextable
            any::fdth
            any::officer
            any::sjPlot
            any::ggtext

      # --- 5. CACHE DOS RESULTADOS (não renderiza de novo o que não mudou) ---
      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('**/*.R', '**/*.xlsx', '**/*.csv') }}-${{ github.sha }}
          restore-keys: |
            freeze-${{ hashFiles('**/*.R', '**/*.xlsx', '**/*.csv') }}-

      # --- 6. RENDERIZAÇÃO E DEPLOY ---
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}